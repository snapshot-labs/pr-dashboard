name: build and deploy

on:
  schedule:
    # every 2 hours; GitHub queues cron, so it is not to the minute
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# one deploy at a time, and let a newer run win
concurrency:
  group: pr-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is for pushing the built page to the gh-pages branch
      contents: write
    env:
      # Hoisted to job env so the Netlify step can test for them in `if`.
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: node test.mjs
        env:
          GH_TOKEN: ${{ secrets.PR_DASHBOARD_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build
        run: node build.mjs
        env:
          # PR_DASHBOARD_TOKEN is a read-only PAT that can see every snapshot-labs
          # repo. The built-in GITHUB_TOKEN is scoped to THIS repo, so it cannot
          # search the org and would silently under-report.
          GH_TOKEN: ${{ secrets.PR_DASHBOARD_TOKEN || secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ vars.PR_AUTHOR || 'tony8713' }}
          PR_ORG: ${{ vars.PR_ORG || 'snapshot-labs' }}
          # Private-repo PRs are withheld from the public page unless this is true.
          INCLUDE_PRIVATE: ${{ vars.INCLUDE_PRIVATE || 'false' }}

      - name: Deploy to Netlify
        # Skipped until the two secrets exist, so the workflow stays green
        # rather than failing on a missing deploy target.
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: |
          npx --yes netlify-cli@17 deploy \
            --prod \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message "scheduled rebuild ${GITHUB_SHA::7}"

      - name: Publish to the gh-pages branch
        # Plain git push rather than actions/deploy-pages: this repo's Pages is
        # configured as a branch source ("legacy"), and deploy-pages only works
        # when Pages is switched to a GitHub Actions source. This way activating
        # the workflow needs no Pages reconfiguration.
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
