# The GitHub Action builds dist/ and pushes it with the Netlify CLI, so Netlify
# itself runs no build. Keep it that way: a Netlify-side build would need a
# GitHub token in Netlify's environment as well.
[build]
  publish = "dist"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
